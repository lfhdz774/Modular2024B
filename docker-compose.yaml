services:
  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - '5000:5000'
    volumes:
      - /backend:/project
  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - '3000:3000'
    volumes:
      - /frontend:/node_modules
      - /frontend:/src